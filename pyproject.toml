[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shieldwall"
version = "0.3.1"
description = "Zero-dependency security firewall, tool-poisoning scanner & secret redactor for MCP (Model Context Protocol) servers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["mcp", "model-context-protocol", "claude", "ai-security", "prompt-injection", "firewall"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/andrejpimenov122-lab/mcp-shieldwall"
Website = "https://mcpshieldwall.dpdns.org"
Repository = "https://github.com/andrejpimenov122-lab/mcp-shieldwall"
"Live Playground" = "https://huggingface.co/spaces/snsnshnwh/mcp-shieldwall"
"Bug Tracker" = "https://github.com/andrejpimenov122-lab/mcp-shieldwall/issues"

[project.scripts]
mcp-shieldwall = "mcp_shieldwall.cli:main"
mcp-shieldwall-server = "mcp_shieldwall.mcp_server:main"
