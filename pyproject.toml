[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shieldwall"
version = "0.2.0"
description = "Zero-dependency security firewall, tool-poisoning scanner & secret redactor for MCP (Model Context Protocol) servers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["mcp", "model-context-protocol", "claude", "ai-security", "prompt-injection", "firewall"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
mcp-shieldwall = "mcp_shieldwall.cli:main"
